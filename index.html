<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-Layer Pure Image Parallax Hero</title>
    <style>
        /* --- CSS STYLING --- */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Match this background color to the bottom edge color of Layer 7 
               to ensure a seamless transition into the webpage content */
            background-color: #0b111e; 
            overflow-x: hidden;
            font-family: sans-serif;
            color: #fff;
        }

        /* Hero Container holding the layers */
        .parallax-hero {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Base configuration for all 7 layers */
        .parallax-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            /* 130% height gives the faster-moving foreground layers enough 
               "bleed" room so they don't reveal blank gaps at the bottom */
            height: 110%; 
            background-size: cover;
            background-position: bottom center;
            background-repeat: no-repeat;
            will-change: transform;
            /* Hardware-accelerated 3D transform driven by JS Custom Properties */
            transform: translateY(calc(var(--scroll, 0) * var(--speed-factor, 0px)));
        }

        /* --- LAYER IMAGE ASSIGNMENTS --- 
           Replace the placeholder image URLs below with your own assets.
           Layers 2 through 7 MUST be transparent PNGs or WebPs. */
           
        /* Layer 1: Background/Sky (Farthest back) */
        .layer-1 { background-image: url('./assests/1.png'); height: 120%; } 
        
        /* Midground Layers */
        .layer-2 { background-image: url('./assests/2.png'); height: 120%; }
        .layer-3 { background-image: url('./assests/3.png'); }
        .layer-4 { background-image: url('./assests/4.png'); }
        .layer-5 { background-image: url('./assests/5.png'); }
        .layer-6 { background-image: url('./assests/6.png'); }
        
        /* Layer 7: Foreground (Closest to screen) */
        .layer-7 { background-image: url('./assests/7.png'); }

        /* Content Section below the Parallax Hero to allow page scrolling */
        .content-section {
            position: relative;
            z-index: 20;
            background-color: #0b111e; /* Same color as body background */
            padding: 120px 20px;
            text-align: center;
        }

        .content-section h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .content-section p {
            max-width: 600px;
            margin: 0 auto;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #8fa0ba;
        }
    </style>
</head>
<body>

    <div class="parallax-hero">
        <div class="parallax-layer layer-1" data-speed="0.05"></div>
        <div class="parallax-layer layer-2" data-speed="0.15"></div>
        <div class="parallax-layer layer-3" data-speed="0.30"></div>
        <div class="parallax-layer layer-4" data-speed="0.45"></div>
        <div class="parallax-layer layer-5" data-speed="0.55"></div>
        <div class="parallax-layer layer-6" data-speed="0.70"></div>
        <div class="parallax-layer layer-7" data-speed="0.75"></div>
    </div>

    <div class="content-section">
        <h2>Your Journey Begins</h2>
        <p>Scroll back up and down to experience the 7-layer depth animation. Make sure your transparent layer graphics match the background color of this section for a perfect visual blend.</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const layers = document.querySelectorAll(".parallax-layer");

            window.addEventListener("scroll", () => {
                const scrolled = window.pageYOffset;

                // requestAnimationFrame enforces silky-smooth performance mapping to monitor refresh rates
                requestAnimationFrame(() => {
                    layers.forEach(layer => {
                        const speed = layer.getAttribute("data-speed");
                        
                        // Dynamically update CSS variables assigned to each layer element
                        layer.style.setProperty("--scroll", scrolled);
                        layer.style.setProperty("--speed-factor", `${speed}px`);
                    });
                });
            });
        });
    </script>
</body>
</html>
