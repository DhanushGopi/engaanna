<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-Layer Proportional Responsive Parallax Hero</title>
    <style>
        /* --- CSS STYLING --- */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b111e; 
            overflow-x: hidden;
            font-family: sans-serif;
            color: #fff;
        }

        /* Hero Container holding the layers */
        .parallax-hero {
            position: relative;
            width: 100%;
            height: 100vh; 
            overflow: hidden; /* Changed from visible to prevent layout spills on short screens */
            background-color: #ffffff;
        }

        /* Base configuration for all 7 layers */
        .parallax-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-repeat: no-repeat;
            will-change: transform;
            /* Added an extra CSS variable (--base-offset) to handle dynamic height adjustments dynamically */
            transform: translateY(calc((var(--scroll, 0) * var(--speed-factor, 0px)) + var(--base-offset, 0px)));
            
            /* Desktop Default Alignment Rules */
            background-size: contain;
            background-position: bottom center;
        }

        /* --- LAYER IMAGE ASSIGNMENTS (DESKTOP DEFAULT) --- */
        .layer-1 { background-image: url('./assests/1.gif'); top: 0px; left: 0; } 
        .layer-2 { background-image: url('./assests/2.png'); top: 30px; left: 0; }
        .layer-3 { background-image: url('./assests/3.png'); top: 25px; left: 0; }
        .layer-4 { background-image: url('./assests/4.png'); top: 20px; left: 0; }
        .layer-5 { background-image: url('./assests/5.png'); top: 15px; left: 0; }
        .layer-6 { background-image: url('./assests/6.png'); top: 10px; left: 0; }
        .layer-7 { background-image: url('./assests/7.png'); top: 0px; left: 0; }

        /* Content Sections below the Parallax Hero */
        .content-section {
            position: relative;
            z-index: 20;
            background-color: #0b111e;
            padding: 120px 20px;
            text-align: center;
        }

        .content-section h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .content-section p {
            max-width: 600px;
            margin: 0 auto;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #8fa0ba;
        }

        /* ==========================================================================
            FIXED RESPONSIVE BREAKPOINTS (Mobile Views 320px up to 1080px)
           ========================================================================== */

        @media (max-width: 1080px) {
            .parallax-hero {
                height: 100vh !important;
                background-color: #ffffff !important; 
            }

            .parallax-layer {
                top: 0 !important;
                height: 100% !important;
                /* Standardized cover sizing to eliminate static position conflicts */
                background-size: cover !important;
                background-position: center bottom !important;
            }

            /* Assigning mobile graphics universally */
            .layer-1 { background-image: url('./assests/mob1.png'); } 
            .layer-2 { background-image: url('./assests/mob2.png'); }
            .layer-3 { background-image: url('./assests/mob3.png'); }
            .layer-4 { background-image: url('./assests/mob4.png'); }
            .layer-5 { background-image: url('./assests/mob5.png'); }
            .layer-6 { background-image: url('./assests/mob6.png'); }
            .layer-7 { background-image: url('./assests/mob7.png'); }
        }

        /* Notice: The old @media (max-width: 520px) which had hardcoded percentages has been completely 
           removed because the positioning calculations are now entirely dynamically managed via JS. */

        @media (max-width: 768px) {
            .content-section { padding: 60px 20px; }
            .content-section h2 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="parallax-hero">
        <div class="parallax-layer layer-1" data-speed="0.05" data-mobile-bias="-0.20"></div>
        <div class="parallax-layer layer-2" data-speed="0.12" data-mobile-bias="-0.15"></div>
        <div class="parallax-layer layer-3" data-speed="0.22" data-mobile-bias="-0.10"></div>
        <div class="parallax-layer layer-4" data-speed="0.35" data-mobile-bias="-0.06"></div>
        <div class="parallax-layer layer-5" data-speed="0.48" data-mobile-bias="-0.03"></div>
        <div class="parallax-layer layer-6" data-speed="0.55" data-mobile-bias="-0.01"></div>
        <div class="parallax-layer layer-7" data-speed="0.62" data-mobile-bias="0.00"></div>
    </div>

    <div class="content-section">
        <h2>Your Journey Begins</h2>
        <p>Scroll back up and down to experience the 7-layer depth animation.</p>
    </div>
    <div class="content-section">
        <h2>Your Journey Begins</h2>
        <p>Scroll back up and down to experience the 7-layer depth animation.</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const layers = document.querySelectorAll(".parallax-layer");

            const handleScroll = () => {
                const scrolled = window.pageYOffset;
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                const isMobileView = windowWidth <= 1080;

                requestAnimationFrame(() => {
                    layers.forEach(layer => {
                        let speed = parseFloat(layer.getAttribute("data-speed"));
                        let baseOffset = 0;

                        if (isMobileView) {
                            speed = speed * 0.15; // Maintain your compressed mobile parallax scale

                            // Fallback read for customized depth biases per layer
                            const bias = parseFloat(layer.getAttribute("data-mobile-bias")) || 0;
                            
                            /* DYNAMIC CALCULATION: 
                              Instead of using CSS percentages, we factor in the live device height.
                              This keeps layers spaced beautifully whether on a stubby iPhone SE or a tall modern device.
                            */
                            baseOffset = windowHeight * bias;
                        }

                        layer.style.setProperty("--scroll", scrolled);
                        layer.style.setProperty("--speed-factor", `${speed}px`);
                        layer.style.setProperty("--base-offset", `${baseOffset}px`);
                    });
                });
            };

            window.addEventListener("scroll", handleScroll, { passive: true });
            window.addEventListener("resize", handleScroll);
            handleScroll(); // Initial run to position elements instantly
        });
    </script>
</body>
</html>
