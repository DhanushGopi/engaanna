<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-Layer Full-Bleed Parallax Hero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b111e; 
            overflow-x: hidden;
            font-family: sans-serif;
            color: #fff;
        }

        /* --- THE HERO CONTAINER --- */
        .parallax-hero {
            position: relative;
            width: 100%;
            height: 100vh; 
            overflow: hidden; 
            background-color: #ffffff; 
        }

        /* --- BASE LAYER CONFIGURATION --- */
        .parallax-layer {
            position: absolute;
            top: -10%; 
            left: 0;
            width: 100%;
            height: 120%; 
            background-repeat: no-repeat;
            will-change: transform;
            transform: translateY(calc(var(--scroll, 0) * var(--speed-factor, 0px) * -1));
        }

        /* ==========================================================================
           1. DESKTOP ASSET CONFIGURATION (Screens wider than 768px)
           ========================================================================== */
        @media (min-width: 769px) {
            .parallax-layer { background-size: contain; }
            .layer-1 { background-image: url('./assests/1.gif'); background-position: center top 15%; } 
            .layer-2 { background-image: url('./assests/2.png'); background-position: center center; }
            .layer-3 { background-image: url('./assests/3.png'); background-position: center center; }
            .layer-4 { background-image: url('./assests/4.png'); background-position: center center; }
            .layer-5 { background-image: url('./assests/5.png'); background-position: center center; }
            .layer-6 { background-image: url('./assests/6.png'); background-position: center center; }
            .layer-7 { background-image: url('./assests/7.png'); background-position: center bottom; }
        }

        /* ==========================================================================
           2. MOBILE ASSET CONFIGURATION (Screens 768px and below)
           ========================================================================== */
        @media (max-width: 768px) {
            .parallax-hero {
                height: 100vh !important; /* Slightly increased to give the building height breathing room */
                background-color: #ffffff !important; 
            }

            .parallax-layer {
                top: -8%;
                height: 116%;
            }

            /* --- FIX FOR BACKGROUND TEXT & LOGO LAYER --- */
            .layer-1 { 
                background-image: url('./assests/mob1.png'); 
                /* Using 95% width ensures the text and top logo scale nicely without clipping off-screen */
                background-size: 95% auto !important; 
                background-position: center top 5% !important; 
            } 

            /* --- FIX FOR THE BUILDING BACKGROUND --- */
            .layer-2 { 
                background-image: url('./assests/mob2.png'); 
                /* Contain keeps the architectural sketch fully visible inside the frame */
                background-size: contain !important; 
                background-position: center top 50% !important; 
            }

            /* --- CHARACTER LAYERS (STAY EXTENDED TO EDGES) --- */
            .layer-3 { background-image: url('./assests/mob3.png'); background-size: cover !important; background-position: center top 60% !important; }
            .layer-4 { background-image: url('./assests/mob4.png'); background-size: cover !important; background-position: center top 70% !important; }
            .layer-5 { background-image: url('./assests/mob5.png'); background-size: cover !important; background-position: center top 80% !important; }
            .layer-6 { background-image: url('./assests/mob6.png'); background-size: cover !important; background-position: center top 90% !important; }
            .layer-7 { background-image: url('./assests/mob7.png'); background-size: cover !important; background-position: center bottom !important; }
        }

        /* Content Sections */
        .content-section {
            position: relative;
            z-index: 20;
            background-color: #0b111e;
            padding: 120px 20px;
            text-align: center;
        }

        .content-section h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .content-section p {
            max-width: 600px;
            margin: 0 auto;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #8fa0ba;
        }

        @media (max-width: 768px) {
            .content-section { padding: 60px 20px; }
            .content-section h2 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="parallax-hero">
        <div class="parallax-layer layer-1" data-speed="0.02"></div>
        <div class="parallax-layer layer-2" data-speed="0.06"></div>
        <div class="parallax-layer layer-3" data-speed="0.12"></div>
        <div class="parallax-layer layer-4" data-speed="0.18"></div>
        <div class="parallax-layer layer-5" data-speed="0.24"></div>
        <div class="parallax-layer layer-6" data-speed="0.30"></div>
        <div class="parallax-layer layer-7" data-speed="0.36"></div>
    </div>

    <div class="content-section">
        <h2>Your Journey Begins</h2>
        <p>Scroll back up and down to experience the 7-layer depth animation.</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const layers = document.querySelectorAll(".parallax-layer");

            const handleScroll = () => {
                const scrolled = window.pageYOffset || document.documentElement.scrollTop;
                const isMobile = window.innerWidth <= 768;

                requestAnimationFrame(() => {
                    layers.forEach(layer => {
                        let speed = parseFloat(layer.getAttribute("data-speed"));
                        
                        if (isMobile) {
                            speed = speed * 0.22; 
                        }

                        layer.style.setProperty("--scroll", scrolled);
                        layer.style.setProperty("--speed-factor", `${speed}px`);
                    });
                });
            };

            window.addEventListener("scroll", handleScroll, { passive: true });
            window.addEventListener("resize", handleScroll);
            handleScroll();
        });
    </script>
</body>
</html>
