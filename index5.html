<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-Layer Proportional Responsive Parallax Hero</title>
    <style>
        /* --- CSS STYLING --- */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b111e; 
            overflow-x: hidden;
            font-family: sans-serif;
            color: #fff;
        }

        /* Hero Container holding the layers */
        .parallax-hero {
            position: relative;
            width: 100%;
            height: 100vh; 
            overflow: visible;
            background-color: #ffffff;
        }

        /* Base configuration for all 7 layers */
        .parallax-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-repeat: no-repeat;
            will-change: transform;
            transform: translateY(calc(var(--scroll, 0) * var(--speed-factor, 0px)));
            
            /* Desktop Default Alignment Rules */
            background-size: contain;
            background-position: bottom center;
        }

        /* --- LAYER IMAGE ASSIGNMENTS (DESKTOP DEFAULT) --- */
        .layer-1 { background-image: url('./assests/1.gif'); top: 0px; left: 0; } 
        .layer-2 { background-image: url('./assests/2.png'); top: 30px; left: 0; }
        .layer-3 { background-image: url('./assests/3.png'); top: 25px; left: 0; }
        .layer-4 { background-image: url('./assests/4.png'); top: 20px; left: 0; }
        .layer-5 { background-image: url('./assests/5.png'); top: 15px; left: 0; }
        .layer-6 { background-image: url('./assests/6.png'); top: 10px; left: 0; }
        .layer-7 { background-image: url('./assests/7.png'); top: 0px; left: 0; }

        /* Content Sections below the Parallax Hero */
        .content-section {
            position: relative;
            z-index: 20;
            background-color: #0b111e;
            padding: 120px 20px;
            text-align: center;
        }

        .content-section h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .content-section p {
            max-width: 600px;
            margin: 0 auto;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #8fa0ba;
        }

        /* ==========================================================================
            FIXED RESPONSIVE BREAKPOINTS (Mobile & Tablet Views 320px up to 1080px)
           ========================================================================== */

        @media (max-width: 1080px) {
            .parallax-hero {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh !important;
                background-color: #ffffff !important; 
                overflow: hidden !important;
            }

            .parallax-layer {
                top: auto !important;
                left: 50% !important;
                height: 100vh !important;
                transform: translate(-50%, calc(var(--scroll, 0) * var(--speed-factor, 0px))) !important;
                background-size: contain !important;
                background-position: center bottom !important;
            }

            /* --- TABLET VIEW (521px to 1080px) ---
               Uses Desktop Assets, but scales safely inside an aspect-ratio box */
            @media (min-width: 521px) {
                .parallax-layer {
                    /* Matches standard landscape/desktop design proportion limits */
                    aspect-ratio: 16 / 9 !important; 
                    width: calc(100vh * (16 / 9)) !important;
                    max-width: none !important;
                }
                /* Explicitly re-binding the desktop files to override global mobile changes */
                .layer-1 { background-image: url('./assests/1.gif') !important; } 
                .layer-2 { background-image: url('./assests/tab2.png') !important; top: 0 !important; }
                .layer-3 { background-image: url('./assests/tab3.png') !important; top: 0 !important; }
                .layer-4 { background-image: url('./assests/tab4.png') !important; top: 0 !important; }
                .layer-5 { background-image: url('./assests/tab5.png') !important; top: 0 !important; }
                .layer-6 { background-image: url('./assests/tab6.png') !important; top: 0 !important; }
                .layer-7 { background-image: url('./assests/tab7.png') !important; top: 0 !important; }
            }

            /* --- MOBILE VIEW (320px to 520px) ---
               Maintains the target mobile portrait asset configurations */
            @media (max-width: 520px) {
                .parallax-layer {
                    width: 100% !important;
                    height: auto !important;
                    aspect-ratio: 412 / 914 !important;
                }
                .layer-1 { background-image: url('./assests/mob1.png'); } 
                .layer-2 { background-image: url('./assests/mob2.png'); }
                .layer-3 { background-image: url('./assests/mob3.png'); }
                .layer-4 { background-image: url('./assests/mob4.png'); }
                .layer-5 { background-image: url('./assests/mob5.png'); }
                .layer-6 { background-image: url('./assests/mob6.png'); }
                .layer-7 { background-image: url('./assests/mob7.png'); }
            }
        }

        @media (max-width: 768px) {
            .content-section { padding: 60px 20px; }
            .content-section h2 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="parallax-hero">
        <div class="parallax-layer layer-1" data-speed="0.05"></div>
        <div class="parallax-layer layer-2" data-speed="0.12"></div>
        <div class="parallax-layer layer-3" data-speed="0.22"></div>
        <div class="parallax-layer layer-4" data-speed="0.35"></div>
        <div class="parallax-layer layer-5" data-speed="0.48"></div>
        <div class="parallax-layer layer-6" data-speed="0.55"></div>
        <div class="parallax-layer layer-7" data-speed="0.62"></div>
    </div>

    <div class="content-section">
        <h2>Your Journey Begins</h2>
        <p>Scroll back up and down to experience the 7-layer depth animation.</p>
    </div>
    <div class="content-section">
        <h2>Your Journey Begins</h2>
        <p>Scroll back up and down to experience the 7-layer depth animation.</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const layers = document.querySelectorAll(".parallax-layer");

            const handleScroll = () => {
                const scrolled = window.pageYOffset;
                const isMobileView = window.innerWidth <= 1080;

                requestAnimationFrame(() => {
                    layers.forEach(layer => {
                        let speed = parseFloat(layer.getAttribute("data-speed"));
                        
                        if (isMobileView) {
                            speed = speed * 0.15; 
                        }

                        layer.style.setProperty("--scroll", scrolled);
                        layer.style.setProperty("--speed-factor", `${speed}px`);
                    });
                });
            };

            window.addEventListener("scroll", handleScroll, { passive: true });
            window.addEventListener("resize", handleScroll);
            handleScroll();
        });
    </script>
</body>
</html>
